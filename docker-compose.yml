# Production stack for the Hostinger VPS. Nginx (CloudPanel) proxies to 127.0.0.1:${APP_PORT}.
services:
  # Run exactly one app container: order writes and the job runner are coordinated in-process.
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_DIR: /app/media
      PROTECTED_MEDIA_DIR: /app/protected-media
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'
    volumes:
      - media:/app/media
      - protected-media:/app/protected-media
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

  # Nightly backups to ./backups on the host (time in UTC). Run one now with:
  #   docker compose run --rm backup --now
  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/backup.sh']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - ./backups:/backups
      - media:/data/media:ro
      - protected-media:/data/protected-media:ro
    depends_on:
      db:
        condition: service_healthy

  # One-off tool, never started by `up`. Seeds pages and the book catalogue into the live volumes:
  #   docker compose --profile tools run --rm seed
  seed:
    profiles: ['tools']
    build:
      context: .
      target: builder
      args:
        NEXT_PUBLIC_SERVER_URL: ${NEXT_PUBLIC_SERVER_URL}
    env_file: .env
    environment:
      NODE_ENV: production # apply committed migrations, never dev schema push
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MEDIA_DIR: /app/media
      PROTECTED_MEDIA_DIR: /app/protected-media
      JOBS_AUTORUN: '0'
    command: ['npm', 'run', 'seed:books']
    volumes:
      - media:/app/media
      - protected-media:/app/protected-media
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  media:
  protected-media:
